name: Deploy to AWS

on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4    
        with:
          role-to-assume: arn:aws:iam::886377049103:role/GitHubActions-CloudPortfolio-Role
          aws-region: ap-northeast-2
      - name: Checkout repository
        uses: actions/checkout@v4          
      - name: Deploy to S3
        run: aws s3 sync . s3://arang-cloud-portfolio --delete        
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1POV5RPH031AS --paths "/*"
              
